- name: 限定模板输入与目录
  ansible.builtin.assert:
    that:
      - edge_server_name is match('^[a-z0-9][a-z0-9.-]+[a-z0-9]$')
      - edge_gateway_upstreams | length > 0
      - edge_gateway_upstreams | select('match', '^[0-9.]+:[0-9]{1,5}$') | list | length == edge_gateway_upstreams | length
      - edge_certificate_dir is match('^/[^\r\n]+$')
      - edge_config_file == project_root + '/.local/edge/default.conf'
      - "'deploy/nginx/server.conf.j2' in release.files"
- name: OpenSSL 核对证书域名、有效期与私钥
  ansible.builtin.command:
    argv: ["{{ tools_python }}", "{{ project_root }}/tools/deploy/validate_tls.py", --certificate-dir, "{{ edge_certificate_dir }}", --host, "{{ edge_server_name }}"]
  changed_when: false
- ansible.builtin.file:
    path: "{{ project_root }}/.local/edge"
    state: directory
    mode: '0700'
- name: 核对管理机模板与本发行相同
  ansible.builtin.stat:
    path: "{{ project_source }}/deploy/nginx/server.conf.j2"
    checksum_algorithm: sha256
  register: edge_template_stat
  delegate_to: "{{ groups['release_controller'][0] }}"
- ansible.builtin.assert:
    that: edge_template_stat.stat.checksum == release.files['deploy/nginx/server.conf.j2']
- name: 先渲染候选 Nginx 配置
  ansible.builtin.template:
    src: "{{ project_source }}/deploy/nginx/server.conf.j2"
    dest: "{{ project_root }}/.local/edge/candidate.conf"
    mode: '0600'
- name: 候选配置校验通过才能替换
  ansible.builtin.command:
    argv: [docker, run, --rm, --network, none, --volume, "{{ project_root }}/.local/edge/candidate.conf:/etc/nginx/conf.d/default.conf:ro", --volume, "{{ edge_certificate_dir }}:/etc/nginx/tls:ro", "{{ release.images.nginx }}", nginx, -t]
  changed_when: false
- name: 保存候选配置，随后重建单个入口容器加载新文件
  ansible.builtin.copy:
    src: "{{ project_root }}/.local/edge/candidate.conf"
    dest: "{{ edge_config_file }}"
    remote_src: true
    backup: true
    mode: '0600'
  register: edge_config_backup
