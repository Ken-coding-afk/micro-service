- ansible.builtin.import_playbook: controller-start.yaml
- name: 唯一初始化机核对资源并发布配置
  hosts: resource_controller
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - ansible.builtin.assert:
        that: groups['resource_controller'] | length == 1
    - ansible.builtin.include_tasks: tasks/preflight.yaml
      vars:
        release_phase: initialize
    - name: 固定 create/verify 资源入口
      ansible.builtin.command:
        argv: ["{{ tools_python }}", "{{ project_root }}/tools/infra/init.py", --env-file, "{{ environment_file }}", --phase, resources, --resources, "{{ project_root }}/infra/resources.yaml"]
      no_log: true
      changed_when: true
    - name: 先核对 Nacos 差异
      ansible.builtin.command:
        argv: ["{{ tools_python }}", "{{ project_root }}/tools/config/publish.py", --env-file, "{{ environment_file }}", --source, "{{ project_root }}/config/nacos", --dry-run]
      no_log: true
      changed_when: false
    - name: 使用同一发布器的摘要冲突保护
      ansible.builtin.command:
        argv: ["{{ tools_python }}", "{{ project_root }}/tools/config/publish.py", --env-file, "{{ environment_file }}", --source, "{{ project_root }}/config/nacos"]
      no_log: true
      changed_when: true
    - ansible.builtin.include_tasks: tasks/finish.yaml
- ansible.builtin.import_playbook: controller-finish.yaml
