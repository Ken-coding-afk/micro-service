- ansible.builtin.import_playbook: controller-start.yaml
- name: 先检查本次迁移已完成
  hosts: release_controller
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_vars:
        file: "{{ release_file }}"
        name: release
    - name: 使用完整 inventory 的显式应用范围，不允许 limit 跳过控制阶段
      ansible.builtin.assert:
        that:
          - ansible_limit is not defined
          - groups['apps'] | length > 0
          - recovery_operation is not defined or recovery_reviewed | default(false) | bool
    - ansible.builtin.set_fact:
        deployment_targets: {}
    - ansible.builtin.set_fact:
        deployment_targets: "{{ deployment_targets | combine({item: hostvars[item].app_services}) }}"
      loop: "{{ groups['apps'] }}"
    - ansible.builtin.copy:
        dest: "{{ control_state_dir }}/{{ project_code }}-{{ app_env }}/{{ operation_id }}-targets.json"
        content: "{{ deployment_targets | to_nice_json }}"
        mode: '0600'
    - name: 回退在管理锁内核对当前成功发行和期限
      when: rollback_requested | default(false) | bool
      block:
        - ansible.builtin.assert:
            that:
              - rollback_authorization_reviewed | default(false) | bool
              - rollback_from is defined
        - ansible.builtin.command:
            argv:
              - "{{ tools_python }}"
              - "{{ project_source }}/tools/deploy/deployment_receipt.py"
              - check
              - --release
              - "{{ release_file }}"
              - --receipt
              - "{{ control_state_dir }}/{{ project_code }}-{{ app_env }}/latest-deployment.json"
              - --rollback-from
              - "{{ rollback_from }}"
              - --attempt
              - "{{ control_state_dir }}/{{ project_code }}-{{ app_env }}/latest-attempt.json"
              - --targets
              - "{{ control_state_dir }}/{{ project_code }}-{{ app_env }}/{{ operation_id }}-targets.json"
          changed_when: false
    - name: 核对当前发行迁移凭据
      when: release.migrations | length > 0
      block:
        - ansible.builtin.slurp:
            src: "{{ control_state_dir }}/{{ project_code }}-{{ app_env }}/migration-{{ release.id }}.json"
          register: migration_receipt
        - ansible.builtin.assert:
            that:
              - (migration_receipt.content | b64decode | from_json).status == 'completed'
              - (migration_receipt.content | b64decode | from_json).manifest_sha256 == (lookup('ansible.builtin.file', release_file, rstrip=False) | hash('sha256'))
- name: 在可能更新实例前记录本次范围和成功基线
  hosts: release_controller
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - ansible.builtin.command:
        argv: "{{ [tools_python, project_source + '/tools/deploy/deployment_receipt.py', 'begin', '--release', release_file, '--receipt', control_state_dir + '/' + project_code + '-' + app_env + '/' + operation_id + '-attempt.json', '--targets', control_state_dir + '/' + project_code + '-' + app_env + '/' + operation_id + '-targets.json'] + (['--recovery-operation', recovery_operation] if recovery_operation is defined else []) + (['--schema-release', rollback_from] if rollback_requested | default(false) | bool else []) }}"
      changed_when: true
- name: 全部目标主机预检通过后才能修改实例
  hosts: apps
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_tasks: tasks/preflight.yaml
      vars:
        release_phase: deploy
- name: 应用逐主机更新，失败停止后续批次
  hosts: apps
  serial: 1
  order: inventory
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_tasks: tasks/network.yaml
    - ansible.builtin.assert:
        that:
          - app_services | length > 0
          - app_services | difference(release.images.keys() | list) | length == 0
          - maintenance_window | default(false) | bool
          - smoke_url is match('^https://[^\r\n]+$')
          - not (bootstrap_identity | default(false) | bool) or 'identity-service' in app_services
    - name: 核对实际 Compose 展开后的镜像与健康检查（不归档秘密）
      ansible.builtin.command:
        argv: "{{ [tools_python, project_root + '/tools/deploy/verify_release.py', '--root', project_root, '--release', project_root + '/deploy/release.yaml', '--project', project_code, '--environment', app_env, '--compose-env', compose_env_file] + (app_services | map('regex_replace', '^', '--service=') | list) }}"
      no_log: true
      changed_when: false
    - name: 先拉取选定镜像，失败不能停止旧服务
      community.docker.docker_compose_v2_pull:
        project_src: "{{ project_root }}"
        files: "{{ release.compose_files }}"
        env_files: ["{{ compose_env_file }}"]
        services: "{{ app_services }}"
        include_deps: false
        policy: always
      no_log: true
    - name: 首次身份 bootstrap 或幂等核对
      ansible.builtin.command:
        argv: "{{ ['docker','compose','--project-directory',project_root,'--env-file',compose_env_file] + (release.compose_files | map('regex_replace','^','--file=') | list) + ['run','--rm','--no-deps','identity-bootstrap'] }}"
        chdir: "{{ project_root }}"
      when: bootstrap_identity | default(false) | bool
      no_log: true
      changed_when: true
    - name: 身份、网关、业务、入口按依赖排序
      ansible.builtin.set_fact:
        ordered_services: "{{ (['identity-service','api-gateway'] | select('in', app_services) | list) + (app_services | difference(['identity-service','api-gateway','nginx']) | sort) + (['nginx'] | select('in', app_services) | list) }}"
    - name: 更新选定服务
      ansible.builtin.include_tasks: tasks/update-service.yaml
      loop: "{{ ordered_services }}"
      loop_control:
        loop_var: application_service
    - ansible.builtin.include_tasks: tasks/finish.yaml
- name: 全部主机烟测成功后记录回退窗口
  hosts: release_controller
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: 全部所选实例就绪后再验证公开入口，首次安装不依赖尚未部署的 Nginx
      ansible.builtin.uri:
        url: "{{ hostvars[item].smoke_url }}"
        status_code: "{{ hostvars[item].smoke_status | default(200) }}"
        validate_certs: true
        follow_redirects: none
        timeout: 15
      loop: "{{ groups['apps'] }}"
      no_log: true
    - ansible.builtin.command:
        argv:
          - "{{ tools_python }}"
          - "{{ project_source }}/tools/deploy/deployment_receipt.py"
          - record
          - --release
          - "{{ release_file }}"
          - --receipt
          - "{{ control_state_dir }}/{{ project_code }}-{{ app_env }}/{{ operation_id }}-deployment.json"
          - --targets
          - "{{ control_state_dir }}/{{ project_code }}-{{ app_env }}/{{ operation_id }}-targets.json"
          - --attempt
          - "{{ control_state_dir }}/{{ project_code }}-{{ app_env }}/{{ operation_id }}-attempt.json"
      changed_when: true
- ansible.builtin.import_playbook: controller-finish.yaml
