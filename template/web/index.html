<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>业务接入示例</title>
<style>
body{max-width:760px;margin:56px auto;padding:0 24px;font:16px/1.7 system-ui;color:#172334;background:#f4f7fa}h1{font-size:28px}section{background:white;padding:24px;margin:20px 0;border-radius:12px}label{display:block;margin:8px 0}input,select,button{font:inherit;padding:6px 10px}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}a{color:#1459a1}
</style>
<h1>业务接入示例</h1>
<p>普通资源的登录、创建、查询和跨服务调用。账号和权限由统一管理界面配置。</p>
<a href="/identity/admin/">打开身份管理</a>
<section>
  <form id="login" method="post" action="/bff/web/login">
    <label>租户代码 <input name="tenant_code" required pattern="[a-z][a-z0-9-]*"></label>
    <input type="hidden" name="_csrf" id="login-csrf">
    <button type="submit">登录业务应用</button>
  </form>
  <p id="login-error" role="alert"></p>
</section>
<section>
  <label>业务服务 <select id="service"><option value="java">Java</option><option value="python">Python</option></select></label>
  <label>资源名称 <input id="name" maxlength="120" value="示例资源"></label>
  <button id="create">创建</button>
  <button id="list">查询</button>
  <button id="peer">通过当前服务查询另一服务</button>
  <pre id="result" aria-live="polite">登录后操作；无权限时接口会明确拒绝。</pre>
</section>
<script src="/sample.js" defer></script>
</html>
