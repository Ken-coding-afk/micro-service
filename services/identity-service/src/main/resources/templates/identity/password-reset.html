<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>重置密码</title><link rel="stylesheet" href="/identity/admin/login-common.css"></head>
<body><main><h1>重置密码</h1><p th:if="${completed}">密码已更新，原有登录已失效，请使用新密码重新登录。</p>
<div th:unless="${completed}"><p>输入管理员单独交付的重置凭证。凭证 15 分钟内有效，只能使用一次。</p><p class="error" role="alert" th:if="${error}" th:text="${error}"></p>
<form action="/identity/password/reset" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<label for="reset-token">重置凭证</label><input id="reset-token" name="token" type="password" maxlength="128" autocomplete="off" required>
<label for="password">新密码</label><input id="password" name="password" type="password" maxlength="64" autocomplete="new-password" required>
<label for="confirmation">确认新密码</label><input id="confirmation" name="confirmation" type="password" maxlength="64" autocomplete="new-password" required><button type="submit">保存新密码</button></form></div>
<p><a href="/identity/admin/">返回管理台登录</a></p></main></body></html>
