<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>已登录</title><style>body{font:16px/1.6 system-ui,sans-serif;background:#f5f7fa;color:#18212f;margin:0}main{max-width:420px;margin:8vh auto;padding:32px;background:white;border:1px solid #dce2e8;border-radius:12px}h1{font-size:25px;margin:0 0 20px}label{display:block;margin-top:16px}input,select,button{box-sizing:border-box;width:100%;font:inherit;padding:10px;border:1px solid #aeb9c7;border-radius:6px}button{margin-top:24px;background:#174d9a;color:white;border:0;cursor:pointer}p{margin:12px 0}.error{color:#a12020}small{color:#526176}a{color:#174d9a}</style></head><body><main><h1>已登录</h1><p th:text="${platform?'平台身份验证已完成。':'租户身份验证已完成。'}"></p><p>可以返回应用继续操作。</p><p th:if="${externalEnabled}"><a href="/identity/external">绑定或解绑第三方账号</a></p><form action="/identity/logout" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit">退出当前登录</button></form></main></body></html>
