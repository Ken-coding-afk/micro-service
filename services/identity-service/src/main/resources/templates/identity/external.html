<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>外部账号绑定</title></head><body><main><h1>外部账号绑定</h1><p>请在近期登录本租户账号后操作。绑定完成后需要重新登录；不会按邮箱自动合并账号。</p>
<form action="/identity/external/start" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="mode" value="BIND"><label>租户标识 <input name="tenant_code" required></label><label>提供方 <select name="provider"><option th:each="provider:${providers}" th:value="${provider}" th:text="${provider}"></option></select></label><button type="submit">验证并绑定外部账号</button></form>
<h2>已绑定提供方</h2><form th:each="binding:${bindings}" action="/identity/external/unlink" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="provider" th:value="${binding}"><span th:text="${binding}"></span><button type="submit">解除绑定</button></form><a href="/identity/session">返回账号</a></main></body></html>
