[project]
name = "sample-python-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["ken-platform-sdk[db]==1.0.0rc3", "uvicorn==0.54.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sample_service"]

[project.scripts]
sample-api = "sample_service.main:main"

[dependency-groups]
migration = ["alembic==1.20.1"]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.1", "ruff==0.17.2", "mypy==2.4.0"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv.sources]
ken-platform-sdk = { path = "../../sdk/python", editable = true }
