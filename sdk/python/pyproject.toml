[project]
name = "ken-platform-sdk"
version = "1.0.0rc3"
description = "Ken 微服务框架 Python 接入包：配置发现、身份校验、租户上下文、HTTP 与可选 DB/MQ"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anyio>=4.12,<5",
    "prometheus-client>=0.21,<1",
    "fastapi>=0.162.0,<0.163",
    "httpx>=0.28.1,<0.29",
    "nacos-sdk-python==3.2.0",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.7,<3",
    "pyyaml>=6.0.2,<7",
    "circuitbreaker==2.1.3",
]

[project.optional-dependencies]
db = [
    "sqlalchemy[asyncio]>=2.1.6,<2.2",
    "psycopg[binary]>=3.3.6,<3.4",
    "alembic>=1.20.1,<1.21",
]
mq = [
    "aio-pika>=10.2.1,<11",
    "sqlalchemy[asyncio]>=2.1.6,<2.2",
    "psycopg[binary]>=3.3.6,<3.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.4.1,<1.5",
    "ruff>=0.12",
    "mypy>=1.14",
    "types-pyyaml==6.0.12.20260906",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ken_platform_sdk"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[[tool.mypy.overrides]]
module = ["v2.nacos.*", "grpc.*"]
ignore_missing_imports = true
