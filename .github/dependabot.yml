version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
- package-ecosystem: maven
  directory: /
  schedule:
    interval: weekly
- package-ecosystem: uv
  directories:
  - /
  - /sdk/python
  - /services/*
  schedule:
    interval: weekly
- package-ecosystem: npm
  directory: /services/identity-service/admin
  schedule:
    interval: weekly
