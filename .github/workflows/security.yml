name: Security scans
'on':
  push: null
  pull_request: null
  workflow_dispatch: null
  schedule:
  - cron: 17 3 * * 1
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        fetch-depth: 0
        persist-credentials: false
        submodules: recursive
    - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af
      with:
        go-version: 1.25.0
    - run: 'go install github.com/zricethezav/gitleaks/v8@v8.30.1

        "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner'
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        persist-credentials: false
        submodules: recursive
        fetch-depth: 0
    - id: scope
      name: Skip dependency build for documentation-only changes
      env:
        BASE_REV: ${{ github.event.pull_request.base.sha || github.event.before }}
        HEAD_REV: ${{ github.event.pull_request.head.sha || github.sha }}
        EVENT_NAME: ${{ github.event_name }}
      run: "if [[ \"$EVENT_NAME\" == \"schedule\" || \"$EVENT_NAME\" == \"workflow_dispatch\" || ! \"$BASE_REV\"\
        \ =~ ^[0-9a-f]{40}$ || \"$BASE_REV\" == \"0000000000000000000000000000000000000000\" ]]; then\n  echo \"\
        needed=true\" >> \"$GITHUB_OUTPUT\"\nelse\n  git diff --name-only \"$BASE_REV\" \"$HEAD_REV\" | python3\
        \ -c 'import sys; paths=sys.stdin.read().splitlines(); print(\"needed=\" + str(any(not (p.endswith(\".md\"\
        ) or p.startswith((\"docs/\", \".cursor/\", \".codegraph/\"))) for p in paths)).lower())' >> \"$GITHUB_OUTPUT\"\
        \nfi"
    - uses: actions/cache/restore@3edfce9056124e459a23f683a21433670d47daca
      with:
        path: ~/.m2/repository/org/owasp/dependency-check-data
        key: nvd-12.1.0-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: nvd-12.1.0-${{ runner.os }}-
      if: steps.scope.outputs.needed == 'true'
    - uses: actions/setup-java@816722acf8fd27c9d1e9ae6ee6085da07e0d44c1
      with:
        distribution: temurin
        java-version: '21'
      if: steps.scope.outputs.needed == 'true'
    - uses: astral-sh/setup-uv@0192b6951893e558e24cfbd971d641a8cd336a95
      with:
        version: 0.13.5
        python-version: '3.12'
      if: steps.scope.outputs.needed == 'true'
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24.13.0
      if: steps.scope.outputs.needed == 'true'
    # 先更新并保存数据库，后续审计发现漏洞也不会丢失已完成的冷启动缓存。
    - name: Update vulnerability database from OWASP NVD mirror
      run: ./mvnw -B -N org.owasp:dependency-check-maven:12.1.0:update-only -DnvdDatafeedUrl=https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/nvdcve-{0}.json.gz
      if: steps.scope.outputs.needed == 'true'
    - uses: actions/cache/save@3edfce9056124e459a23f683a21433670d47daca
      with:
        path: ~/.m2/repository/org/owasp/dependency-check-data
        key: nvd-12.1.0-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      if: steps.scope.outputs.needed == 'true'
    - run: 'npm install --global pnpm@11.12.0

        chmod +x mvnw

        ./mvnw -B -DskipTests install

        ./mvnw -B org.owasp:dependency-check-maven:12.1.0:aggregate -DfailBuildOnCVSS=7 -Dformats=JSON,HTML -DossindexAnalyzerEnabled=false -DnvdDatafeedUrl=https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/nvdcve-{0}.json.gz'
      if: steps.scope.outputs.needed == 'true'
    - run: "for directory in . sdk/python services/*; do\n  if [ -f \"$directory/pyproject.toml\" ]; then\n    uv\
        \ export --frozen --all-extras --project \"$directory\" --format requirements-txt --no-emit-local > /tmp/audit-requirements.txt\n\
        \    uvx pip-audit==2.10.0 -r /tmp/audit-requirements.txt || exit 1\n  fi\ndone\npnpm --dir services/identity-service/admin\
        \ install --frozen-lockfile\npnpm --dir services/identity-service/admin audit --audit-level high"
      if: steps.scope.outputs.needed == 'true'
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always() && steps.scope.outputs.needed == 'true'
      with:
        name: dependency-check-report
        path: target/dependency-check-report.*
        retention-days: 14
        if-no-files-found: warn
