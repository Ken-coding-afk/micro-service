name: Scaffold release check
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@816722acf8fd27c9d1e9ae6ee6085da07e0d44c1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.13.0
      - uses: astral-sh/setup-uv@0192b6951893e558e24cfbd971d641a8cd336a95
        with:
          version: 0.13.5
          python-version: '3.12'
      - run: |
          npm install --global pnpm@11.12.0
          uv sync --frozen
          pnpm --dir services/identity-service/admin install --frozen-lockfile
          pnpm --dir services/identity-service/admin exec playwright install --with-deps chromium
      - name: Verify selected commit
        env:
          CANDIDATE: ${{ runner.temp }}/scaffold-candidate
          PROJECT: sc-check-${{ github.run_id }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          DEV_HOST=$(ip -4 route get 1.1.1.1 | awk '{for(i=1;i<=NF;i++)if($i=="src"){print $(i+1);exit}}')
          uv run --frozen python scripts/verify_scaffold.py --ref "$SOURCE_COMMIT" --output "$CANDIDATE" --project "$PROJECT" --port-offset 4000 --dev-host "$DEV_HOST"
      - name: Preserve sanitized report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: scaffold-release-report
          path: ${{ runner.temp }}/scaffold-candidate/.local/release-check/report.json
          if-no-files-found: error
          include-hidden-files: true
