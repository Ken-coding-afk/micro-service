name: Source checks
'on':
  push:
    paths-ignore:
    - docs/**
    - '**/*.md'
    - .cursor/**
    - .codegraph/**
  pull_request:
    paths-ignore:
    - docs/**
    - '**/*.md'
    - .cursor/**
    - .codegraph/**
  workflow_dispatch:
    inputs:
      base:
        description: 'Python 检查的显式基线提交'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - &id001
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        persist-credentials: false
        submodules: recursive
        fetch-depth: 0
    - &id002
      uses: astral-sh/setup-uv@0192b6951893e558e24cfbd971d641a8cd336a95
      with:
        version: 0.13.5
        python-version: '3.12'
    - run: |
        uv sync --frozen
        uv run --frozen ruff check scripts
        uv run --frozen python - <<'PY'
        from pathlib import Path
        import sys
        import yaml
        sys.stdout.reconfigure(encoding='utf-8')
        sys.stderr.reconfigure(encoding='utf-8')
        workflow = yaml.safe_load(Path('.github/workflows/checks.yml').read_text(encoding='utf-8'))
        services = yaml.safe_load(Path('config/services.yaml').read_text(encoding='utf-8'))['services']
        for language in ('java', 'python'):
            entries = workflow['jobs'][language]['strategy']['matrix']['include']
            expected = {'sdk/' + language} | {v['directory'] for v in services.values() if v['language'] == language}
            actual = {v['module'] for v in entries}
            if expected != actual or len(actual) != len(entries):
                raise SystemExit(f'{language}: CI模块与服务登记不一致，请更新显式测试矩阵: {expected ^ actual}')
            for entry in entries:
                tests = entry['tests'].split(',' if language == 'java' else ' ')
                for test in tests:
                    matches = list((Path(entry['module']) / 'src/test/java').rglob(test + '.java')) if language == 'java' else [Path(test)]
                    if not test or not matches or any(not path.is_file() for path in matches):
                        raise SystemExit(f"{entry['module']}: 已声明测试不存在: {test}")
        print('服务与显式定向测试清单一致')
        PY
    - name: Changed Python lint and format
      env:
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base }}
        HEAD: ${{ github.sha }}
      run: |
        if [ "$EVENT" = "pull_request" ]; then
          BASE=$(git merge-base "$BASE" "$HEAD")
        fi
        uv run --frozen python scripts/check_python.py --base "$BASE" --head "$HEAD"
  java:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - &id003
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        persist-credentials: false
        submodules: recursive
        fetch-depth: 0
    - uses: actions/setup-java@816722acf8fd27c9d1e9ae6ee6085da07e0d44c1
      with:
        distribution: temurin
        java-version: '21'
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24.13.0
    - run: npm install --global pnpm@11.12.0
    - env:
        MODULE: ${{ matrix.module }}
        TESTS: ${{ matrix.tests }}
      run: |
        chmod +x mvnw
        ./mvnw -B -pl "$MODULE" -am install -DskipTests
        ./mvnw -B -pl "$MODULE" test -Dtest="$TESTS" -Dsurefire.failIfNoSpecifiedTests=true -DfailIfNoTests=true
    needs: scope
    strategy:
      fail-fast: false
      matrix:
        include:
        - module: sdk/java
          tests: OutboundCallBudgetTest,ApiErrorsTest,DeveloperContextTest,EnvironmentBindingTest,TypedServiceCallTest,ServiceCallContractTest,CurrentPrincipalTest,NativeComponentSettingsTest,PlatformMetricsAutoConfigurationTest
        - module: services/identity-service
          tests: ManagementInputBoundaryTest,IdentityApiResponsesTest,PasswordCredentialsTest,AuditDetailSanitizerTest,MonitoringScopeUpgradeTest,ManagementAuditsTest,BrowserContentSecurityPolicyTest,MonitoringMetricsBindingTest
        - module: services/api-gateway
          tests: BffRelayTest,BffClientSettingsTest,BffMonitoringTest,BffIdentityClientTest,GatewayTokenPreflightFilterTest
        - module: services/sample-java-service
          tests: ItemDeadlineTest,ItemControllerTest
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - *id001
    - *id002
    - env:
        MODULE: ${{ matrix.module }}
        TESTS: ${{ matrix.tests }}
      run: |
        uv sync --frozen --all-extras --project "$MODULE"
        uv run --frozen --all-extras --project "$MODULE" ruff check "$MODULE/src"
        uv run --frozen --all-extras --project "$MODULE" mypy --config-file "$MODULE/pyproject.toml" "$MODULE/src"
        # TESTS来自本仓库可审查矩阵，每个路径无空格，不接受外部输入。
        uv run --frozen --all-extras --project "$MODULE" pytest -c "$MODULE/pyproject.toml" --confcutdir="$MODULE" $TESTS
    needs: scope
    strategy:
      fail-fast: false
      matrix:
        include:
        - module: sdk/python
          tests: sdk/python/tests/test_http.py sdk/python/tests/test_typed_http.py sdk/python/tests/test_circuit.py
            sdk/python/tests/test_config.py sdk/python/tests/test_context_web.py sdk/python/tests/test_observation.py
            sdk/python/tests/test_api_errors.py sdk/python/tests/test_developer_context.py sdk/python/tests/test_database_readiness.py
            sdk/python/tests/test_access_logging.py sdk/python/tests/test_nacos_adapter.py sdk/python/tests/test_version.py
        - module: services/sample-python-service
          tests: services/sample-python-service/tests/test_items.py services/sample-python-service/tests/test_business_config.py
            services/sample-python-service/tests/test_application.py
  admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - *id003
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24.13.0
    - run: |-
        npm install --global pnpm@11.12.0
        pnpm --dir services/identity-service/admin install --frozen-lockfile
        pnpm --dir services/identity-service/admin verify:build
    - run: pnpm --dir services/identity-service/admin exec vitest run tests/monitoring-page.test.ts tests/admin-context.test.ts
  maintenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - *id003
    - uses: astral-sh/setup-uv@0192b6951893e558e24cfbd971d641a8cd336a95
      with:
        version: 0.13.5
        python-version: '3.12'
    - run: |-
        uv sync --frozen
        uv run --frozen pytest tests/project/test_workspace.py tests/project/test_scaffold_export.py tests/project/test_test_execution.py tests/project/test_release_source_order.py tests/deploy/test_dev_launch.py tests/deploy/test_runtime_package.py tests/config/test_monitoring.py tests/config/test_publish_state.py tests/deploy/test_migration_contract.py tests/project/test_python_check_scope.py tests/project/test_cli_failures.py
