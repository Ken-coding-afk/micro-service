[server]
root_url = %(protocol)s://%(domain)s/bff/identity/platform/monitoring/
serve_from_sub_path = true
[security]
allow_embedding = true
content_security_policy = true
content_security_policy_template = """default-src 'self'; script-src 'self' $NONCE; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'self'; object-src 'none'; base-uri 'self'"""
cookie_samesite = strict
[auth]
disable_login_form = true
[auth.basic]
enabled = false
[auth.anonymous]
enabled = false
[auth.proxy]
enabled = true
header_name = X-WEBAUTH-USER
header_property = username
auto_sign_up = true
headers = Role:X-WEBAUTH-ROLE
sync_ttl = 0
enable_login_token = false
[users]
auto_assign_org_role = Viewer
viewers_can_edit = false
[live]
max_connections = 0
[analytics]
reporting_enabled = false
check_for_updates = false
