# infra Compose:只定义第三方组件(设计 03·依赖清单与启用条件)。
# 与 deploy/compose.yaml 是两个独立 Compose 项目,经下方 external network 互通。
# 端口仅映射 loopback 开发端口;组件管理员凭证全部来自 --env-file 指定的本地环境文件。
name: ${INFRA_PROJECT_NAME:-${PROJECT_CODE}-${APP_ENV}-infra}

networks:
  infra-net:
    external: true
    # 项目专属网络,由 scripts/infra/init.py prepare-local 显式创建
    name: ${INFRA_NETWORK:-${PROJECT_CODE}-${APP_ENV}-net}

volumes:
  pgdata:
  redisdata:
  nacosdata:
  nacoslogs:
  rabbitdata:
  prometheusdata:
  grafanadata:

services:
  postgres:
    profiles: [pg]
    image: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
    ports:
      - "${INFRA_BIND_HOST:-127.0.0.1}:${PG_PUBLISHED_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    # 显式加载样例参数;实例参数维护归 infra(设计 03·组件运行配置)
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      infra-net:
        aliases: [postgres]

  redis:
    profiles: [redis]
    image: redis:7.2.16-alpine@sha256:f8548b29a1f1cb358b5fcfec1e0126beab57ad15776c1e87623f865579f16c5a
    ports:
      - "${INFRA_BIND_HOST:-127.0.0.1}:${REDIS_PUBLISHED_PORT:-16379}:6379"
    volumes:
      - redisdata:/data
      # 挂载含真实密码的本地生成副本(prepare-local 生成 .local/redis/redis.conf);
      # 仓库内 redis.conf 是占位模板,秘密不进 Git(设计 02)
      - ${REDIS_CONF_FILE:-./redis/redis.conf}:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      infra-net:
        aliases: [redis]

  nacos:
    profiles: [nacos]
    image: nacos/nacos-server:v3.2.4@sha256:1c191c30c8cd5ff2a72bf576555dbaa57a616378c55168651a74aefadedf7708
    environment:
      MODE: standalone
      # Nacos 3.2 默认强制鉴权;token 须为 Base64(由 prepare-local 生成)
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
    ports:
      # 客户端 API / gRPC / 控制台(console 与引擎端口分离,admin 初始化走 console 端口)
      - "${INFRA_BIND_HOST:-127.0.0.1}:${NACOS_PUBLISHED_PORT:-8848}:8848"
      - "${INFRA_BIND_HOST:-127.0.0.1}:${NACOS_GRPC_PUBLISHED_PORT:-9848}:9848"
      - "${INFRA_BIND_HOST:-127.0.0.1}:${NACOS_CONSOLE_PUBLISHED_PORT:-8080}:8080"
    volumes:
      - nacosdata:/home/nacos/data
      - nacoslogs:/home/nacos/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/ > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      infra-net:
        aliases: [nacos]

  # Rabbit 仅选择消息适配时启用(--profile mq);纯同步 HTTP 示例不启动(设计 03)
  rabbitmq:
    image: rabbitmq:4.1-management-alpine@sha256:54ef5ff505352c1beef05a97ee9bd6ab95b3559a76629ba0119b1d63d8d6e4b2
    profiles: [mq]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_ADMIN_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_ADMIN_PASSWORD}
    ports:
      - "${INFRA_BIND_HOST:-127.0.0.1}:${RABBIT_PUBLISHED_PORT:-5672}:5672"
      - "${INFRA_BIND_HOST:-127.0.0.1}:${RABBIT_MANAGEMENT_PUBLISHED_PORT:-15672}:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      infra-net:
        aliases: [rabbitmq]

  prometheus:
    profiles: [monitoring]
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.15.1}
    command: ["--config.file=/etc/prometheus/prometheus.yaml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./monitoring/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ${MONITORING_TARGETS_FILE:-../.local/runtime/monitoring-targets.json}:/etc/prometheus/targets.json:ro
      - prometheusdata:/prometheus
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [infra-net]
    restart: unless-stopped
  grafana:
    profiles: [monitoring]
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.3.0}
    environment:
      GF_SERVER_ROOT_URL: ${PUBLIC_ORIGIN}/bff/identity/platform/monitoring/
      GF_AUTH_PROXY_WHITELIST: ${MONITORING_PROXY_CIDRS:-}
    ports:
      - "${GRAFANA_BIND_HOST:-127.0.0.1}:${GRAFANA_PUBLISHED_PORT:-13000}:3000"
    volumes:
      - ./monitoring/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./monitoring/datasource.yaml:/etc/grafana/provisioning/datasources/services.yaml:ro
      - ./monitoring/dashboards.yaml:/etc/grafana/provisioning/dashboards/services.yaml:ro
      - ./monitoring/services.json:/var/lib/grafana/dashboards/services.json:ro
      - grafanadata:/var/lib/grafana
    networks: [infra-net]
    restart: unless-stopped
