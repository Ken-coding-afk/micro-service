# PG 实例参数样例(local;测试/生产在主机侧独立维护并核对,设计 03·组件运行配置)。
# 迁移与运行账号、每服务库由 scripts/infra/init.py resources 阶段创建,不在实例参数里。
# 注意:官方镜像默认配置中的 listen_addresses='*' 会被本文件覆盖,必须显式保留
listen_addresses = '*'
max_connections = 100
shared_buffers = 256MB
# 账号维护可能包含凭据；DDL 审计由迁移摘要承担，不记录完整语句。
log_statement = 'none'
log_min_error_statement = 'panic'
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %u@%d '
# 恢复基础:WAL 归档目标由服务器环境挂载决定,本地开发保留默认(设计 10 的备份合同在 T-11A/T-13 落地)
archive_mode = off
