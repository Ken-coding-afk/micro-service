<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录</title><style>body{font:16px/1.6 system-ui,sans-serif;background:#f5f7fa;color:#18212f;margin:0}main{max-width:420px;margin:8vh auto;padding:32px;background:white;border:1px solid #dce2e8;border-radius:12px}h1{font-size:25px;margin:0 0 20px}label{display:block;margin-top:16px}input,select,button{box-sizing:border-box;width:100%;font:inherit;padding:10px;border:1px solid #aeb9c7;border-radius:6px}button{margin-top:24px;background:#174d9a;color:white;border:0;cursor:pointer}p{margin:12px 0}.error{color:#a12020}small{color:#526176}a{color:#174d9a}</style></head><body><main><h1>登录</h1>
<p class="error" role="alert" th:if="${loginError!=null}" th:text="${loginError=='INVALID_CREDENTIALS'?'账号或密码无效。':loginError=='LOGIN_RATE_LIMITED'?'登录请求暂时受限，请稍后重试。':loginError=='PASSWORD_CHANGED_CLEANUP_PENDING'?'密码已更新，请重新登录；会话清理暂不可用。':'登录服务暂不可用，请稍后重试。'}"></p>
<p th:if="${param.changed!=null}">密码已更新，请重新登录。</p><p th:if="${param.logout!=null}">已退出当前登录。</p>
<form action="/identity/login" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<label for="realm">登录类型</label><select id="realm" name="realm"><option value="TENANT" th:selected="${realm=='TENANT'}">租户账号</option><option value="PLATFORM" th:selected="${realm=='PLATFORM'}">平台管理员</option></select>
<label for="tenant">租户标识</label><input id="tenant" name="tenant_code" th:value="${tenantCode}" autocomplete="organization"><small>平台管理员登录时请留空。</small>
<label for="username">账号</label><input id="username" name="username" autocomplete="username" required>
<label for="password">密码</label><input id="password" type="password" name="password" autocomplete="current-password" required><button type="submit">登录</button></form><p th:if="${param.external!=null}">外部账号已绑定，请重新登录。</p><p th:if="${loginError=='EXTERNAL_IDENTITY_NOT_BOUND'}">此外部身份尚未绑定。请先登录本租户账号，再访问外部账号绑定页面；无账号请联系管理员。</p><form th:if="${providers!=null and !providers.empty}" action="/identity/external/start" method="post"><h2>第三方登录</h2><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="mode" value="LOGIN"><label>租户标识<input name="tenant_code" th:value="${tenantCode}" required></label><label>提供方<select name="provider"><option th:each="provider:${providers}" th:value="${provider}" th:text="${provider}"></option></select></label><button type="submit">前往身份提供方</button></form></main></body></html>
