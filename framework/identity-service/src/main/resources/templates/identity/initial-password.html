<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设置新密码</title><style>body{font:16px/1.6 system-ui,sans-serif;background:#f5f7fa;color:#18212f;margin:0}main{max-width:420px;margin:8vh auto;padding:32px;background:white;border:1px solid #dce2e8;border-radius:12px}h1{font-size:25px;margin:0 0 20px}label{display:block;margin-top:16px}input,select,button{box-sizing:border-box;width:100%;font:inherit;padding:10px;border:1px solid #aeb9c7;border-radius:6px}button{margin-top:24px;background:#174d9a;color:white;border:0;cursor:pointer}p{margin:12px 0}.error{color:#a12020}small{color:#526176}a{color:#174d9a}</style></head><body><main><h1>设置新密码</h1><p>完成首次改密后，重新登录即可继续。</p>
<p class="error" role="alert" th:if="${passwordError!=null}" th:text="${passwordError=='PASSWORD_CONFIRM_MISMATCH'?'两次输入的密码不一致。':passwordError=='PASSWORD_REUSE'?'新密码不能与初始密码相同。':passwordError=='PASSWORD_REJECTED'?'请增加密码长度或调整过长内容，并避开常见密码。':'本次修改未完成，请重新登录或稍后重试。'}"></p>
<form action="/identity/password/initial" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label for="password">新密码</label><input id="password" name="password" type="password" autocomplete="new-password" required><small th:text="'至少 '+${minimum}+' 个字符，建议使用易记的长口令。'"></small><label for="confirmation">再次输入新密码</label><input id="confirmation" name="confirmation" type="password" autocomplete="new-password" required><button type="submit">保存并重新登录</button></form><p><a href="/identity/login">返回登录</a></p></main></body></html>
