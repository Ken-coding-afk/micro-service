# T-11A 样例 Alembic 环境(最小配置)。
# 连接信息与 owner 角色不写入本文件:由 migrate.py 经环境变量 DATABASE_URL
# (含 options=-c role=... 与 DDL 超时)注入,秘密与环境值不进仓库(设计 02/03)。
[alembic]
script_location = %(here)s

# sqlalchemy.url 故意留空:env.py 优先读取 DATABASE_URL 环境变量。
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
