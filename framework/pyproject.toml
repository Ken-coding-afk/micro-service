[project]
name = "ken-platform-tools"
version = "0.0.0"
description = "framework 仓库共用工具环境：仅配置发布、资源初始化、迁移与发布脚本的工具依赖；不含业务运行依赖（设计 01·框架仓库目录）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.1",
    "httpx>=0.28.1,<0.29",
    "requests>=2.32.4,<3",
    "psycopg[binary]>=3.3.6,<3.4",
    "pyyaml>=6.0.2,<7",
    "pytest>=8.3",
    "ruff>=0.12",
    "mypy>=1.14",
]

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
