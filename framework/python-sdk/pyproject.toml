[project]
name = "ken-platform-sdk"
version = "1.0.0.dev0"
description = "Ken 微服务框架 Python 接入包：配置发现、身份校验、租户上下文、HTTP 与可选 DB/MQ/Agent 运行支持"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0,<0.163",
    "httpx>=0.28.1,<0.29",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
db = [
    "sqlalchemy>=2.1.6,<2.2",
    "psycopg[binary]>=3.3.6,<3.4",
    "alembic>=1.20.1,<1.21",
]
mq = [
    "aio-pika>=10.2.1,<11",
]
agent = [
    # 聚合运行支持所需 DB/MQ/缓存依赖（设计 08·部署角色与数据归属）
    "ken-platform-sdk[db,mq]",
    "redis>=5.2,<7",
]
langgraph = [
    # 可选适配；精确上游版本由 T-10 冻结并验证 checkpointer 兼容
    "langgraph>=1.0,<2",
    "ken-platform-sdk[db]",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.12",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ken_platform_sdk"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
strict = false
