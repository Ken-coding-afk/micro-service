log_level: INFO
business:
  max_page_size: 50
concurrency:
  inbound_limit: 64
  outbound_limits:
    sample-java-service: 32
http:
  max_connections: 64
  max_keepalive_connections: 32
  circuit_breakers:
    sample-java-service:
      enabled: true
      failure_threshold: 5
      recovery_timeout_seconds: 30
