# 应用生命周期；第三方组件由 infra 独立管理。环境文件/秘密须先准备。
name: ${PROJECT_CODE}-${APP_ENV}-apps
x-java: &java
  restart: unless-stopped
  init: true
  networks: [application]
  stop_grace_period: 30s

services:
  identity-service:
    <<: *java
    image: ${IDENTITY_IMAGE:?指定固定身份镜像}
    env_file: ${RUNTIME_DIR:?指定绝对运行目录}/identity-service.env
    volumes:
      - ${RUNTIME_DIR}/identity-service-secrets:/run/secrets:ro
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:$${MANAGEMENT_SERVER_PORT:-8081}/actuator/health/readiness']
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 20

  identity-bootstrap:
    image: ${IDENTITY_IMAGE:?指定固定身份镜像}
    profiles: [maintenance]
    command: [bootstrap]
    env_file: ${RUNTIME_DIR}/identity-bootstrap.env
    volumes:
      - ${RUNTIME_DIR}/identity-bootstrap-secrets:/run/secrets:ro
    networks: [application]
    restart: "no"

  api-gateway:
    <<: *java
    image: ${GATEWAY_IMAGE:?指定固定网关镜像}
    env_file: ${RUNTIME_DIR}/api-gateway.env
    environment:
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
    volumes:
      - ${RUNTIME_DIR}/api-gateway-secrets:/run/secrets:ro
    depends_on:
      identity-service: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:$${MANAGEMENT_SERVER_PORT:-8080}/actuator/health/readiness']
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20

  nginx:
    image: ${NGINX_IMAGE:?指定固定 Nginx 镜像}
    restart: unless-stopped
    ports:
      - "${ENTRY_BIND_HOST:-127.0.0.1}:${ENTRY_PORT:-18080}:8080"
    volumes:
      - ${EDGE_CONFIG_FILE:-./nginx/local.conf}:/etc/nginx/conf.d/default.conf:ro
      - ${WEB_ROOT:?指定静态页面目录}:/usr/share/nginx/html:ro
    depends_on:
      api-gateway: {condition: service_healthy}
    networks: [application]
    healthcheck:
      test: [CMD-SHELL, 'nginx -t && kill -0 $(cat /var/run/nginx.pid)']
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  application:
    external: true
    name: ${INFRA_NETWORK:-${PROJECT_CODE}-${APP_ENV}-net}
