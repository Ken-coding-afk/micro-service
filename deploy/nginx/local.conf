# 仅本地 HTTP 入口。test/prod 使用项目域名、证书与已核对的可信代理配置。
# 不记录查询、Referer、凭据头或请求体；原生 HTTP 错误日志可能携带完整请求 URI。
log_format framework_safe escape=json
    '{"time":"$time_iso8601","edge_request_id":"$request_id",'
    '"request_id":"$http_x_request_id","method":"$request_method","uri":"$uri",'
    '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
    '"upstream_status":"$upstream_status","upstream_addr":"$upstream_addr",'
    '"upstream_duration":"$upstream_response_time"}';
error_log /dev/null;

server {
    access_log /dev/stdout framework_safe;
    listen 8080;
    server_tokens off;
    client_max_body_size 2m;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/(api/|identity/|oauth2/|login/oauth2/|\.well-known/|bff/|connect/|userinfo$) {
        proxy_pass http://api-gateway:8080;
        proxy_connect_timeout 2s;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 内部接口和健康端点不从公网转发。
    location ~ ^/(internal/|actuator/) { return 404; }
}
